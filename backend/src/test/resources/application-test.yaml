# ==========================================
# 테스트 환경
# ==========================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:swyp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false
