# ==========================================
# 로컬 개발 환경
# ==========================================
spring:
# 데이터베이스 설정 (기본: H2 인메모리)
# PostgreSQL 사용 시 docker-compose up -d postgres 후 아래 주석 블록으로 교체
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:swyp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
#  datasource:
#    driver-class-name: org.postgresql.Driver
#    url: jdbc:postgresql://localhost:5432/swyp
#    username: myuser
#    password: mypassword

# JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true

# H2 로컬 DB 설정
  h2:
    console:
      path: /h2-console
      enabled: true

# Redis 설정 (사용시 주석 해제)
#  data:
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}

# Kafka 설정 (사용시 주석 해제)
#  kafka:
#    bootstrap-servers: ${KAFKA_SERVER:localhost:9092}

# JWT 설정 (로컬 전용 더미 키)
jwt:
  secret: ${JWT_SECRET:bG9jYWwtc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctZm9yLWhzMjU2}

# 개발 로깅 설정
logging:
  level:
    com.swyp.team5: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 스프링 엑츄에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, prometheus"
  endpoint:
    health:
      show-details: always

# CORS 설정 (Next.js 개발 서버)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
