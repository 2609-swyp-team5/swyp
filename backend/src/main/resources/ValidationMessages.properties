# 요청 검증(Bean Validation) 기본 메시지 — API 오류 응답 error.details[].content로 사용자에게 노출되므로 프론트 문체(해요체)에 맞춘다.
jakarta.validation.constraints.NotNull.message=필수 값이에요.
jakarta.validation.constraints.NotBlank.message=값을 입력해 주세요.
jakarta.validation.constraints.NotEmpty.message=값을 입력해 주세요.
jakarta.validation.constraints.Size.message={max}자 이하로 입력해 주세요.
jakarta.validation.constraints.Min.message={value} 이상으로 입력해 주세요.
jakarta.validation.constraints.Max.message={value} 이하로 입력해 주세요.
jakarta.validation.constraints.Positive.message=0보다 큰 값을 입력해 주세요.
jakarta.validation.constraints.PositiveOrZero.message=0 이상으로 입력해 주세요.
jakarta.validation.constraints.Email.message=이메일 형식이 올바르지 않아요.
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않아요.
