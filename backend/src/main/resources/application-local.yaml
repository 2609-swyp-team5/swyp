# ==========================================
# 로컬 개발
# ==========================================
spring:
# 데이터베이스 설정
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Neon은 요청이 없으면 컴퓨트를 일시중지해 비용을 줄이는데, 풀이 유휴 커넥션을 붙잡고 있으면 깨어 있게 된다.
    # 로컬에서는 쓰지 않는 커넥션을 1분 뒤 닫는다.
    hikari:
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
      keepalive-time: 0

# JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true

# JWT 설정
jwt:
  secret: ${JWT_ACCESS_SECRET_KEY:}
  refresh-secret: ${JWT_REFRESH_SECRET_KEY:}
  # 로컬은 HTTP라 secure 쿠키가 브라우저에 저장되지 않는 문제가 있어서 배포 환경과 다르게 적용
  cookie-secure: false
  cookie-same-site: Lax

# 개발 로깅 설정
logging:
  level:
    com.swyp.team5: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 스프링 엑츄에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, prometheus"
  endpoint:
    health:
      show-details: always

# 배치 스케줄러 — 로컬은 기본 비활성.
# 직접 확인할 때 및 운영에서만 활성화한다.
crawl:
  bunjang:
    enabled: ${CRAWL_BUNJANG_ENABLED:false}
    reconcile:
      enabled: ${CRAWL_BUNJANG_RECONCILE_ENABLED:false}

analysis:
  enabled: ${PRICE_ANALYSIS_ENABLED:false}
