# ==========================================
# 로컬 개발
# ==========================================
spring:
# 데이터베이스 설정
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true

# JWT 설정
jwt:
  secret: ${JWT_ACCESS_SECRET_KEY:}
  refresh-secret: ${JWT_REFRESH_SECRET_KEY:}
  # 로컬은 HTTP라 secure 쿠키가 브라우저에 저장되지 않음 - HTTP에서도 통하도록 재정의
  cookie-secure: false
  cookie-same-site: Lax

# 개발 로깅 설정
logging:
  level:
    com.swyp.team5: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 스프링 엑츄에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, prometheus"
  endpoint:
    health:
      show-details: always
