# ==========================================
# 운영 환경
# ==========================================
spring:
# 데이터베이스 설정
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Neon은 요청이 없으면 컴퓨트를 일시중지해 비용을 줄이는데, 풀이 유휴 커넥션을 붙잡고 있으면 깨어 있게 된다.
    # 쓰지 않는 커넥션은 1분 뒤 닫는다(유휴 뒤 첫 요청은 커넥션을 새로 맺느라 조금 느릴 수 있음). 최대 풀 크기는 기본값(10).
    hikari:
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0

# JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate

# JWT 설정
jwt:
  secret: ${JWT_ACCESS_SECRET_KEY}
  refresh-secret: ${JWT_REFRESH_SECRET_KEY}

# 운영 로깅 설정
logging:
  file:
    path: ${LOG_PATH:./logs}
  level:
    root: info
    com.swyp.team5: info

# 스프링 엑츄에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: never
