# ==========================================
# 공통
# ==========================================
spring:
  profiles:
    active: local

# JPA 공통 설정
  jpa:
    open-in-view: false # DB 커넥션 고갈 방지
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100 # IN절 한 번에 가져오는 개수
        jdbc:
          time_zone: Asia/Seoul

# Flyway 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
# Redis 설정 (Refresh Token 저장용, 로컬/운영 모두 Upstash 사용)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

# Kafka 설정 (사용시 주석 해제)
#  kafka:
#    bootstrap-servers: ${KAFKA_SERVER:localhost:9092}

# 파일 업로드(Multipart) 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

# AI 모델 설정 (Gemini, GPT)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}

# CORS 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

# 파일 스토리지 설정
cloud:
  storage:
    provider: ${STORAGE_PROVIDER:R2} # 사용할 스토리지 전략 (R2, LOCAL, NAVER, S3)
  local-storage:
    base-directory: ${LOCAL_STORAGE_DIR:uploads} # 로컬 디스크 저장 경로 (LOCAL 전략 사용 시)
    base-url: ${LOCAL_STORAGE_BASE_URL:http://localhost:8080} # 업로드 파일 다운로드 URL의 호스트
  r2: # Cloud Flare R2
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
  naver: # 네이버 클라우드 Object Storage
    endpoint: ${NAVER_STORAGE_ENDPOINT:}
    region: ${NAVER_STORAGE_REGION:}
    access-key: ${NAVER_STORAGE_ACCESS_KEY:}
    secret-key: ${NAVER_STORAGE_SECRET_KEY:}
    bucket: ${NAVER_STORAGE_BUCKET:}
    public-base-url: ${NAVER_STORAGE_PUBLIC_BASE_URL:}
  s3: # AWS S3
    region: ${AWS_S3_REGION:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    bucket: ${AWS_S3_BUCKET:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

# JWT 설정 (secret/refresh-secret은 profile별 파일에서 설정)
jwt:
  access-token-expires: ${JWT_ACCESS_TOKEN_EXPIRES:30m}
  refresh-token-expires: ${JWT_REFRESH_TOKEN_EXPIRES:14d}
  # Refresh Token 쿠키 속성 - 배포환경은 HTTPS 크로스 사이트 배포라 secure+SameSite=None 필요,
  # 로컬은 HTTP라 secure 쿠키가 저장 자체가 안 돼 application-local.yaml에서 재정의 했습니다.
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}

# 구글 소셜 로그인 설정 (프론트에서 전달한 ID Token 검증용)
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# 카카오 소셜 로그인 설정
kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/kakao}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

naver:
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}
  redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:3000/oauth/naver}
  token-uri: https://nid.naver.com/oauth2.0/token
  user-info-uri: https://openapi.naver.com/v1/nid/me
  # 프론트가 인증 URL에 싣는 값과 같아야 한다. 서버 발급 방식으로 바꾸기 전까지의 임시 고정값.
  state: ${NAVER_STATE:swyp}

# 시세 데이터 수집(번개장터 크롤링) 설정
crawl:
  bunjang:
    enabled: ${CRAWL_BUNJANG_ENABLED:true}
    cron: ${CRAWL_BUNJANG_CRON:0 0 * * * *} # 매 시간 정각에 실행
    page-limit: ${CRAWL_BUNJANG_PAGE_LIMIT:8} # 한 번에 크롤링할 페이지 수 제한(60건/페이지, 대형 카테고리 커버리지 확보 위해 5→8로 상향)
    reconcile:
      enabled: ${CRAWL_BUNJANG_RECONCILE_ENABLED:true}
      cron: ${CRAWL_BUNJANG_RECONCILE_CRON:0 30 5 * * *} # 매일 새벽 5시 30분(카테고리 크롤링과 겹치지 않는 시간대)
      stale-after-hours: ${CRAWL_BUNJANG_RECONCILE_STALE_AFTER_HOURS:20} # 이 시간 넘게 갱신 안 된 SELLING 매물을 재확인 대상으로 삼음
      batch-size: ${CRAWL_BUNJANG_RECONCILE_BATCH_SIZE:300} # 한 사이클에 재확인할 최대 매물 수
      call-interval-ms: ${CRAWL_BUNJANG_RECONCILE_CALL_INTERVAL_MS:500} # 개별 호출 간 최소 대기 시간

# 시세 분석(감가/추천) 배치 설정
analysis:
  enabled: ${PRICE_ANALYSIS_ENABLED:true}
  cron: ${PRICE_ANALYSIS_CRON:0 0 0/6 * * *} # 6시간마다(00/06/12/18시, 크롤링이 여러 번 돈 뒤라 비교 매물이 충분히 쌓여있음)
  min-listings: ${PRICE_ANALYSIS_MIN_LISTINGS:3} # 비교 매물이 이 수보다 적으면 분석을 건너뜀
  freshness-hours: ${PRICE_ANALYSIS_FRESHNESS_HOURS:24} # 비교 매물로 인정할 최근 수집 기준 시간
  sample-size: ${PRICE_ANALYSIS_SAMPLE_SIZE:30} # AI 프롬프트에 포함할 매물 샘플 최대 개수
  ai-call-interval-ms: ${PRICE_ANALYSIS_AI_CALL_INTERVAL_MS:6500} # AI 호출 간 최소 대기 시간(Gemini 무료 티어 RPM 제한 대응)

# 스웨거 설정
springdoc:
  swagger-ui:
    path: /swagger
    groups-order: desc
    operations-sorter: method
    disable-swagger-default-url: true
  api-docs:
    path: /docs
