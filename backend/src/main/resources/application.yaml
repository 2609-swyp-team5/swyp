# ==========================================
# 공통
# ==========================================
spring:
  profiles:
    active: local

# JPA 공통 설정
  jpa:
    open-in-view: false # DB 커넥션 고갈 방지
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100 # IN절 한 번에 가져오는 개수
        jdbc:
          time_zone: Asia/Seoul
# Redis 설정 (사용시 주석 해제)
#  data:
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}

# Kafka 설정 (사용시 주석 해제)
#  kafka:
#    bootstrap-servers: ${KAFKA_SERVER:localhost:9092}

# 파일 스토리지 설정
cloud:
  storage:
    provider: ${STORAGE_PROVIDER:R2} # 사용할 스토리지 전략 (R2, LOCAL, NAVER, S3)
  local-storage:
    base-directory: ${LOCAL_STORAGE_DIR:uploads} # 로컬 디스크 저장 경로 (LOCAL 전략 사용 시)
    base-url: ${LOCAL_STORAGE_BASE_URL:http://localhost:8080} # 업로드 파일 다운로드 URL의 호스트
  r2: # Cloud Flare R2
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
  naver: # 네이버 클라우드 Object Storage
    endpoint: ${NAVER_STORAGE_ENDPOINT:}
    region: ${NAVER_STORAGE_REGION:}
    access-key: ${NAVER_STORAGE_ACCESS_KEY:}
    secret-key: ${NAVER_STORAGE_SECRET_KEY:}
    bucket: ${NAVER_STORAGE_BUCKET:}
    public-base-url: ${NAVER_STORAGE_PUBLIC_BASE_URL:}
  s3: # AWS S3
    region: ${AWS_S3_REGION:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    bucket: ${AWS_S3_BUCKET:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

# JWT 설정
jwt:
  secret: ${JWT_SECRET:bG9jYWwtc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctZm9yLWhzMjU2}
  access-token-expiration: 3600000       # 1시간
  refresh-token-expiration: 1209600000   # 14일

# 스웨거 설정
springdoc:
  swagger-ui:
    path: /swagger
    groups-order: desc
    operations-sorter: method
    disable-swagger-default-url: true
  api-docs:
    path: /docs
---
# ==========================================
# 로컬 개발
# ==========================================
spring:
  config:
    activate:
      on-profile: local

# 데이터베이스 설정
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:swyp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

# JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
# H2 로컬 DB 설정
  h2:
    console:
      path: /h2-console
      enabled: true

# 개발 로깅 설정
logging:
  level:
    com.swyp.team5: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 스프링 엑츄에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, prometheus"
  endpoint:
    health:
      show-details: always

---
# ==========================================
# 운영 환경
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

# 데이터베이스 설정
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate

# 운영 로깅 설정
logging:
  level:
    root: info
    com.swyp.team5: info

# 스프링 엑츄에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: never
