# ==========================================
# 개발 서버
# ==========================================
spring:
# 데이터베이스 설정
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Neon은 요청이 없으면 컴퓨트를 일시중지해 비용을 줄이는데, 풀이 유휴 커넥션을 붙잡고 있으면 깨어 있게 된다.
    # 쓰지 않는 커넥션은 1분 뒤 닫는다(유휴 뒤 첫 요청은 커넥션을 새로 맺느라 조금 느릴 수 있음). 최대 풀 크기는 기본값(10).
    hikari:
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0

# JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        highlight_sql: true

# JWT 설정
jwt:
  secret: ${JWT_ACCESS_SECRET_KEY}
  refresh-secret: ${JWT_REFRESH_SECRET_KEY}

# 개발 로깅 설정
logging:
  level:
    com.swyp.team5: debug
    org.hibernate.SQL: info # SQL 로그가 많아 꺼 둠(필요할 때만 debug)
    org.hibernate.orm.jdbc.bind: info # 바인딩 값(개인정보 포함 가능) 로그 꺼 둠(필요할 때만 trace)

# 스프링 엑츄에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, prometheus"
  endpoint:
    health:
      show-details: always
