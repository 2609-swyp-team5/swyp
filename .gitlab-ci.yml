workflow:
  rules:
    # Merge Request 이벤트 발생 시 파이프라인 실행
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # 이미 MR이 열려있는 브랜치의 중복 브랜치 파이프라인 실행 차단
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # MR이 없는 일반 브랜치에 push될 때만 실행
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/.gradle"
# ==========================================
# Backend
# ==========================================
backend-test:
  stage: test
  image: eclipse-temurin:21-jdk
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle.kts
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/

  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew spotlessCheck test

  rules:
    - changes:
        - backend/**/*

backend-build:
  stage: build
  image: eclipse-temurin:21-jdk
  needs:
    - backend-test

  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle.kts
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/

  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew build -x test

  artifacts:
    paths:
      - backend/build/libs/app.jar
    expire_in: 1 week

  rules:
    - changes:
        - backend/**/*

# ==========================================
# Groq 코드 리뷰
# ==========================================
groq-code-review:
  stage: test
  image: alpine:latest
  variables:
    GIT_DEPTH: "0"
    GROQ_MODEL: "openai/gpt-oss-120b"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

  before_script:
    - apk add --no-cache git curl jq

  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - export DIFF_RANGE="origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD"
    - git diff "$DIFF_RANGE" > diff.txt
    - head -c 60000 diff.txt > diff_truncated.txt
    - |
      export REVIEW_PROMPT="아래는 GitLab Merge Request의 'git diff' 결과야. 이 변경 사항만 보고 코드 리뷰를 해줘.
      버그 가능성, 재사용/단순화, 성능 이슈 위주로만 지적하고 사소한 스타일 지적은 하지 마.
      지적할 때는 파일 경로와 줄 번호(diff 상의 위치 기준)를 함께 표시해.
      diff만으로는 판단이 어려운 부분은 가정임을 명시해.
      문제를 찾지 못했으면 다른 말 없이 '특별한 문제를 발견하지 못했습니다.'라고만 답해.
      반드시 한국어 마크다운으로만 답하고, 그 외 다른 설명은 하지 마."
    - |
      jq -n --arg model "$GROQ_MODEL" --arg prompt "$REVIEW_PROMPT" --rawfile diff diff_truncated.txt \
        '{model: $model, messages: [{role: "user", content: ($prompt + "\n\n```diff\n" + $diff + "\n```")}]}' \
        > request.json
    - |
      curl -s -X POST \
        "https://api.groq.com/openai/v1/chat/completions" \
        -H "Authorization: Bearer ${GROQ_API_KEY}" \
        -H "Content-Type: application/json" \
        -d @request.json \
        -o response.json
    - |
      jq -r '.choices[0].message.content // ("Groq API 오류: " + (.error.message // "알 수 없는 응답 형식"))' \
        response.json > review.md
    - |
      jq -Rs '{body: ("**Groq 코드 리뷰**\n\n" + .)}' review.md > note.json
      curl --fail --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data @note.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"

  artifacts:
    paths:
      - review.md
    expire_in: 1 week
    when: always

  allow_failure: true

