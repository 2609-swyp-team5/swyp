# ==========================================
# Frontend
# ==========================================
frontend-test:
  stage: test
  image: node:24-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx tsc --noEmit
    - npm run lint
    - npm run format:check
    # test 설정 후 주석 해제
    # - npm run test

  rules:
    - exists:
        - frontend/**/*
      changes:
        - frontend/**/*

frontend-build:
  stage: build
  image: node:24-alpine
  needs:
    - frontend-test

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build

  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

  rules:
    - exists:
        - frontend/package.json
      changes:
        - frontend/**/*

frontend-deploy:
  stage: deploy
  image: node:24-alpine
  needs:
    - frontend-build

  script:
    - cd frontend
    - npm install -g vercel
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      exists:
        - frontend/package.json
      changes:
        - frontend/**/*
