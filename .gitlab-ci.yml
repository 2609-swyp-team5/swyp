# ==========================================
# 2. Frontend
# ==========================================
frontend-test:
  stage: test
  image: node:24-alpine
  cache:
    key: node-modules
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    # 1. 타입 검사
    - npx tsc --noEmit
    # 2. 코드 스타일 및 린트 검사
    - npm run lint
    # 3. 단위 테스트 (test 설정 후 주석 해제)
    # - npm run test
  rules:
    - changes:
        - frontend/**/*

frontend-build:
  stage: build
  image: node:24-alpine
  cache:
    key: node-modules
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  rules:
    - changes:
        - frontend/**/*
      when: on_success

