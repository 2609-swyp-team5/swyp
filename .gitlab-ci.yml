workflow:
  rules:
    # Merge Request 이벤트 발생 시 파이프라인 실행
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # 이미 MR이 열려있는 브랜치의 중복 브랜치 파이프라인 실행 차단
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # MR이 없는 일반 브랜치에 push될 때만 실행
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/.gradle"
# ==========================================
# Backend
# ==========================================
backend-test:
  stage: test
  image: eclipse-temurin:21-jdk
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle.kts
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/

  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew test

  rules:
    - changes:
        - backend/**/*

backend-build:
  stage: build
  image: eclipse-temurin:21-jdk
  needs:
    - backend-test

  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle.kts
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/

  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew build -x test

  artifacts:
    paths:
      - backend/build/libs/app.jar
    expire_in: 1 week

  rules:
    - changes:
        - backend/**/*

