stages:
  - test
  - build
# 배포 연동 후 deploy 항목 주석 해제
#  - deploy

# ==========================================
# Backend
# ==========================================
backend-test:
  stage: test
  image: eclipse-temurin:21-jdk
  cache:
    key: gradle-cache
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew test
  rules:
    - changes:
        - backend/**/*

backend-build:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew build -x test
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 week
  rules:
    - changes:
        - backend/**/*
      when: on_success

