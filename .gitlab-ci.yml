  before_script:
    - apk add --no-cache openssh-client openssl > /dev/null
    - eval $(ssh-agent -s) > /dev/null
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add - 2> /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2> /dev/null
  script:
    - |
      ssh $EC2_USER@$EC2_HOST '
        echo "== 서버 시각"; date
        echo "== 서비스 상태"; systemctl show swyp-backend -p ActiveEnterTimestamp -p EnvironmentFiles
        echo "== AI 관련 설정(키 값은 길이만)"
        ENVS=$(sudo cat /proc/$(systemctl show swyp-backend -p MainPID --value)/environ 2>/dev/null | tr "\0" "\n")
        echo "$ENVS" | grep -E "^(GEMINI_CHAT_MODEL|OPENAI_CHAT_MODEL|AI_CHAT_|SPRING_AI_|SPRING_PROFILES_ACTIVE)=" || echo "(해당 환경 변수 없음 - 기본값 사용)"
        for k in GEMINI_API_KEY OPENAI_API_KEY; do v=$(echo "$ENVS" | grep "^$k=" | cut -d= -f2-); echo "$k 길이=${#v}"; done
        echo "== 최근 6시간 AI 관련 로그"
        sudo journalctl -u swyp-backend --since "6 hours ago" --no-pager | grep -E -A4 "Gemini|OpenAI|GPT|AI 대화|AiChat|/ai/chats|GenAi|genai|Timeout|timed out" | tail -400
      ' > server-log.txt 2>&1 || true
    - echo "수집한 줄 수 $(wc -l < server-log.txt)"
    - echo "$LOG_CERT" > cert.pem
    - openssl cms -encrypt -binary -aes256 -in server-log.txt -out server-log.enc -outform DER cert.pem
    - rm -f server-log.txt
  artifacts:
    paths:
      - server-log.enc
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "chore/tmp-server-log"
