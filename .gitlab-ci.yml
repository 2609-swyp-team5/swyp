workflow:
  rules:
    # Merge Request 이벤트 발생 시 파이프라인 실행
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # 이미 MR이 열려있는 브랜치의 중복 브랜치 파이프라인 실행 차단
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # MR이 없는 일반 브랜치에 push될 때만 실행
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/.gradle"
  TZ: "Asia/Seoul"
# ==========================================
# Backend
# ==========================================
backend-test:
  stage: test
  image: eclipse-temurin:21-jdk
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle.kts
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/

  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew spotlessCheck test

  rules:
    - changes:
        - backend/**/*

backend-build:
  stage: build
  image: eclipse-temurin:21-jdk
  needs:
    - backend-test

  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle.kts
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/

  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew build -x test

  artifacts:
    paths:
      - backend/build/libs/app.jar
    expire_in: 1 week

  rules:
    - changes:
        - backend/**/*

# ==========================================
# Gemini 코드 리뷰
# 필요 CI/CD 변수: GEMINI_API_KEY, GITLAB_REVIEW_TOKEN (api scope PAT)
# ==========================================
code-review:
  stage: test
  image: node:24-alpine
  variables:
    GIT_DEPTH: "0"
    GEMINI_MODEL: "gemini-flash-latest"
    MAX_DIFF_LINES: "1500"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

  before_script:
    - apk add --no-cache git curl jq
    - npm install -g @google/gemini-cli

  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git diff "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD" > diff.txt
    - |
      DIFF_LINES=$(wc -l < diff.txt)
      if [ "$DIFF_LINES" -gt "$MAX_DIFF_LINES" ]; then
        echo "diff가 ${DIFF_LINES}줄로 너무 커서(최대 ${MAX_DIFF_LINES}줄) 자동 리뷰를 생략했습니다. 직접 리뷰를 진행해 주세요." > review.md
      else
        cat diff.txt | gemini --yolo --skip-trust --model "$GEMINI_MODEL" --prompt "아래는 GitLab Merge Request의 git diff 내용이다.
      이 텍스트만 보고 리뷰하고, 다른 파일을 열거나 셸 명령을 실행하지 마.
      버그 가능성, 재사용/단순화, 성능 이슈 위주로만 지적하고 사소한 스타일 지적은 하지 마.
      지적할 때는 파일 경로와 줄 번호를 함께 표시해.

      다음 톤앤매너 지침을 반드시 지켜서 작성해.
      - 모든 문장은 상호 존중을 바탕으로 존댓말(해요체/하십시오체)을 사용해.
      - '고치세요' 같은 명령조 대신 '~해 주세요', '~하면 어떨까요?', '~해 보시는 건 어떨까요?' 같은 제안형 문장을 사용해.
      - 주어는 작성자가 아니라 코드나 로직에 둬. 예를 들어 '왜 이렇게 하셨나요?' 대신 '이 로직은 ~한 우려가 있어 보입니다'처럼 표현해.
      - 단순 취향 차이로 변경을 요청하지 말고, 성능, 가독성, 예외 처리 등 변경이 필요한 객관적인 근거를 함께 제시해.
      - 잘 작성된 부분이나 좋은 아이디어가 있으면 적극적으로 칭찬하고 감사를 표현해.

      지적할 문제가 없으면 '특별한 문제를 발견하지 못했습니다.'라는 문장과, 위 톤앤매너를 지킨 짧은 칭찬 한두 문장만 덧붙여.
      반드시 한국어 마크다운으로만 답하고, 그 외 다른 설명은 하지 마." > review.md
      fi
    - |
      jq -Rs '{body: ("**코드 리뷰**\n\n" + .)}' review.md > note.json
      curl --fail --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_REVIEW_TOKEN}" \
        --header "Content-Type: application/json" \
        --data @note.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"

  artifacts:
    paths:
      - review.md
      - diff.txt
    expire_in: 1 week
    when: always

  allow_failure: true

