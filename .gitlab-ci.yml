workflow:
  rules:
    # Merge Request 이벤트 발생 시 파이프라인 실행
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # develop/main push(머지)만 브랜치 파이프라인 실행. 기능 브랜치 push는 돌리지 않는다 — push 직후 MR을 만들면 브랜치·MR
    # 파이프라인이 같은 잡을 두 번 돌려 러너 1대(동시 2잡)에 줄이 섰다($CI_OPEN_MERGE_REQUESTS는 MR이 열린 뒤에만 막음).
    # 기능 브랜치는 MR을 열면 검사된다(push 전 검사는 husky pre-push)
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    # 파이프라인 화면에서 직접 실행(Run pipeline)한 경우
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/.gradle"
  TZ: "Asia/Seoul"
# ==========================================
# MR 공통
# ==========================================
# 나머지 잡은 모두 backend/·frontend/ 변경 시에만 돌기 때문에, docs·CI 설정만 바꾼 MR은 실행할 잡이 없어 파이프라인이
# 만들어지지 않는다("파이프라인 성공 필수" 설정이라 머지가 막힘). 모든 MR에서 항상 도는 가벼운 잡으로 파이프라인을 보장한다.
mr-check:
  stage: test
  image: alpine:3.22
  script:
    - echo "MR 파이프라인 생성 확인"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ==========================================
# Backend
# ==========================================
# 필요 CI/CD 변수(GitLab 프로젝트 설정에 masked로 등록): TEST_DB_DRIVER_CLASS_NAME,
# TEST_DB_URL, TEST_DB_USERNAME, TEST_DB_PASSWORD (Neon swyp-test 브랜치 접속 정보),
# TEST_JWT_SECRET, TEST_JWT_REFRESH_SECRET (테스트 전용 JWT 서명 키)
# TEST_PLATFORM_SESSION_ENCRYPTION_KEY (선택, 외부 플랫폼 세션 암호화 키 — Base64 32바이트, 미등록 시
# application-test.yaml의 테스트 전용 더미 키 사용)
# 테스트와 jar 빌드를 한 잡에서 한다(`build` = spotlessCheck + test + bootJar) — 잡을 나누면 컴파일을 두 번 하고 잡 기동·캐시
# 복원도 두 번 걸린다
backend-test:
  stage: test
  image: eclipse-temurin:21-jdk
  # 테스트 DB는 잡마다 러너 안에 띄우는 PostgreSQL 17(Neon과 같은 메이저 버전) — 원격 Neon 왕복이 없어 마이그레이션·컨텍스트
  # 기동이 빨라지고, 잡끼리·로컬과 DB를 공유하지 않아 동시 실행해도 서로의 clean에 깨지지 않는다(그래서 resource_group 제거)
  services:
    - name: postgres:17
      alias: testdb
  variables:
    POSTGRES_DB: swyp_test
    POSTGRES_USER: swyp
    POSTGRES_PASSWORD: swyp
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle.kts
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/

  script:
    # 프로젝트 CI 변수(TEST_DB_*, Neon)가 .gitlab-ci.yml variables보다 우선하므로 스크립트에서 덮어쓴다
    - export TEST_DB_DRIVER_CLASS_NAME=org.postgresql.Driver
    - export TEST_DB_URL=jdbc:postgresql://testdb:5432/swyp_test
    - export TEST_DB_USERNAME=swyp
    - export TEST_DB_PASSWORD=swyp
    - cd backend
    - chmod +x gradlew
    - ./gradlew build

  artifacts:
    paths:
      - backend/build/libs/app.jar
    expire_in: 3 days

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
    # develop/main push(머지)는 직전 커밋과 비교
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main")
      changes:
        - backend/**/*
    - if: $CI_PIPELINE_SOURCE == "web"

# 배포 순서 보장: develop에 연달아 머지하면 파이프라인이 동시에 돌아, 늦게 끝난 오래된 파이프라인이 최신 jar를 덮어쓸 수 있다.
# resource_group으로 배포를 한 번에 하나씩만 돌리고, environment를 지정해 GitLab "Prevent outdated deployment jobs"
# (프로젝트 설정, 켜져 있음)가 더 최신 배포가 이미 끝난 뒤의 오래된 배포 잡을 건너뛰게 한다
backend-deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - backend-test
  resource_group: production
  environment:
    name: production

  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

  script:
    - ssh $EC2_USER@$EC2_HOST "cp -f /home/$EC2_USER/app/app.jar /home/$EC2_USER/app/app.jar.bak 2>/dev/null || true"
    - scp backend/build/libs/app.jar $EC2_USER@$EC2_HOST:/home/$EC2_USER/app/app.jar
    - ssh $EC2_USER@$EC2_HOST "sudo systemctl restart swyp-backend"
    - |
      ssh $EC2_USER@$EC2_HOST '
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8080/actuator/health | grep -q "\"status\":\"UP\""; then
            echo "기동 확인"; exit 0
          fi
          sleep 5
        done
        echo "기동 확인 실패 - 최근 로그"; sudo journalctl -u swyp-backend -n 50 --no-pager; exit 1
      '

  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - backend/**/*

# ==========================================
# Frontend
# ==========================================
# 검사(타입·린트·포맷·단위 테스트)와 빌드를 한 잡에서 한다 — 잡을 나누면 npm ci(약 40초)와 잡 기동을 두 번 한다
frontend-test:
  stage: test
  image: node:24-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx tsc --noEmit
    - npm run lint
    - npm run format:check
    - npm run test:run
    - npm run build

  artifacts:
    paths:
      - frontend/.next/
    expire_in: 3 days

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - frontend/package.json
      changes:
        - frontend/**/*
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main")
      exists:
        - frontend/package.json
      changes:
        - frontend/**/*
    - if: $CI_PIPELINE_SOURCE == "web"

# e2e는 MR에서만 돈다 — 스쿼시 머지라 develop에 들어가는 코드는 MR에서 검사한 것과 같아 머지 후 다시 돌리지 않는다.
# frontend-test의 빌드 산출물을 기다리지 않고 자체 빌드로 동시에 돈다(러너 동시 2잡에서는 기다리는 쪽이 더 늦게 끝남)
frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/

  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run test:e2e

  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    expire_in: 3 days

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - frontend/package.json
      changes:
        - frontend/**/*
    - if: $CI_PIPELINE_SOURCE == "web"
